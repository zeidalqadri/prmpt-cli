name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: check tag matches the package version
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, sys
          sys.path.insert(0, "src")
          from prmpt import __version__
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != __version__:
              sys.exit(f"tag {tag} does not match package version {__version__}")
          print(f"releasing {__version__}")
          PY
      - run: python -m build
      - run: python scripts/check_wheel.py dist/*.whl
      - run: python -m unittest discover -s tests
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
