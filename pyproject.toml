[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prmpt-cli"
dynamic = ["version"]
description = "PRS-1 prompt refinement in your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zeid Alqadri" }]
keywords = ["prompt-engineering", "llm", "cli", "prs-1", "prompt-refinement"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: User Interfaces",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/zeidalqadri/prmpt-cli"
Repository = "https://github.com/zeidalqadri/prmpt-cli"
Issues = "https://github.com/zeidalqadri/prmpt-cli/issues"
Changelog = "https://github.com/zeidalqadri/prmpt-cli/blob/main/CHANGELOG.md"
Security = "https://github.com/zeidalqadri/prmpt-cli/blob/main/SECURITY.md"

[project.scripts]
prmpt = "prmpt.cli:main"

[tool.setuptools.dynamic]
version = { attr = "prmpt.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prmpt = ["prompts/*.md", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
