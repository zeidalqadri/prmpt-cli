[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prmpt-cli"
version = "0.1.0"
description = "PRS-1 prompt refinement in your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PRMPT" }]
keywords = ["prompt-engineering", "llm", "cli", "prs-1"]
dependencies = []

[project.scripts]
prmpt = "prmpt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prmpt = ["prompts/*.md"]
